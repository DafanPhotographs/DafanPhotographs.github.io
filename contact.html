<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>联络 / Contact — 小五 / Van Wu</title>
  <meta name="description" content="联络小五 — vanwuuuu@gmail.com" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="./index.html" data-i18n="wordmark">小五</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="./work.html" data-i18n="nav.work">作品</a>
        <a href="./about.html" data-i18n="nav.about">关于</a>
        <a href="./contact.html" aria-current="page" data-i18n="nav.contact">联络</a>
      </nav>
      <div class="header-actions">
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" class="lang-btn is-active" data-set-lang="zh" aria-pressed="true">中</button>
          <span class="lang-sep" aria-hidden="true">|</span>
          <button type="button" class="lang-btn" data-set-lang="en" aria-pressed="false">EN</button>
        </div>
        <a class="ig-link" href="https://www.instagram.com/van_wuuuu/" target="_blank" rel="noopener noreferrer" data-i18n="nav.ig">Instagram</a>
      </div>
    </div>
  </header>

  <main class="site-main">
    <h1 class="page-title" data-i18n="contact.title">联络</h1>

    <ul class="contact-list">
      <li>
        <span class="label" data-i18n="contact.emailLabel">邮箱</span>
        <a href="mailto:vanwuuuu@gmail.com">vanwuuuu@gmail.com</a>
      </li>
      <li>
        <span class="label" data-i18n="contact.igLabel">Instagram</span>
        <a href="https://www.instagram.com/van_wuuuu/" target="_blank" rel="noopener noreferrer">@van_wuuuu</a>
      </li>
    </ul>

    <form class="contact-form" data-mailto-form action="mailto:vanwuuuu@gmail.com" method="get">
      <div class="form-field">
        <label for="name" data-i18n="contact.formName">姓名</label>
        <input id="name" name="name" type="text" autocomplete="name" required />
      </div>
      <div class="form-field">
        <label for="email" data-i18n="contact.formEmail">你的邮箱</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
      </div>
      <div class="form-field">
        <label for="message" data-i18n="contact.formMessage">留言</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button class="form-submit" type="submit" data-i18n="contact.formSubmit">用邮件发送</button>
      <p class="form-note" data-i18n="contact.formNote">将打开你的邮件应用，收件人为 vanwuuuu@gmail.com。</p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span data-i18n="footer.copy">© 2026 小五</span>
      <a href="https://www.instagram.com/van_wuuuu/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </div>
  </footer>

  <script src="./i18n.js"></script>
  <script src="./main.js"></script>
</body>
</html>
